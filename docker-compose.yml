# Levanta todo con `docker compose up --build` (CE-004).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
      POSTGRES_DB: kata
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kata -d kata']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://kata:kata@db:5432/kata
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      ADMIN_KEY: ${ADMIN_KEY:-demo-admin-key}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      HOLD_SWEEP_INTERVAL_MS: ${HOLD_SWEEP_INTERVAL_MS:-2000}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:

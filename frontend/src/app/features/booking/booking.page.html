@if (booking(); as current) {
  <h2>Tu boleto</h2>
  <app-booking-ticket [booking]="current" (newLookup)="startNewLookup()" />
  <p><a routerLink="/search">Buscar otro vuelo</a></p>
} @else {
  <app-booking-lookup
    [initialCode]="code() ?? ''"
    [busy]="busy()"
    [error]="error()"
    (lookup)="find($event)"
  />
}

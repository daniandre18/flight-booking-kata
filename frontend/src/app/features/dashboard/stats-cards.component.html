<dl class="cards">
  <div class="card stat available"><dt>Asientos disponibles</dt><dd>{{ counts().available }}<span>libres para reservar</span></dd></div>
  <div class="card stat held"><dt>Bloqueados</dt><dd>{{ counts().held }}<span>en proceso de compra</span></dd></div>
  <div class="card stat booked"><dt>Reservados</dt><dd>{{ counts().booked }}<span>ventas confirmadas</span></dd></div>
  <div class="card stat occupancy"><dt>Ocupación actual</dt><dd>{{ percent(occupancy()) }}<span>del vuelo vendido</span></dd></div>
</dl>
<p class="total">Capacidad total: <strong>{{ counts().total }} asientos</strong></p>
